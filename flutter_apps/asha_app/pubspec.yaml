name: asha_app
description: Asha — Your Health. Your Journey. Menstrual health tracking app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  http: ^1.2.0
  shared_preferences: ^2.2.2
  google_maps_flutter: ^2.18.1
  geolocator: ^11.0.0
  url_launcher: ^6.2.5
  table_calendar: ^3.1.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7

  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/girl.png

    